<!doctype html>
<!-- PROTOTYPE, throwaway. Three variants of the opening screen and the end screen, switchable with ?variant=A|B|C and ?screen=opening|end. Open this file in a browser. -->
<html>
<head>
<meta charset="utf-8">
<title>PROTOTYPE opening and end screens</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
  #wrap { position: absolute; inset: 44px 0 70px 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 1600px; height: 1000px; overflow: hidden; border-radius: 12px; flex: none; }
  #stage img { position: absolute; pointer-events: none; user-select: none; }
  canvas.layer { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; }
  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
    background: #fff; color: #111; padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 18px #000a; font-size: 14px; white-space: nowrap; z-index: 99; }
  #bar button { border: 0; background: #eee; border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  #bar button.on { background: #111; color: #fff; }
  #bar .sep { width: 1px; height: 22px; background: #ccc; }
  #note { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); color: #ddd; font-size: 14px; background: #000a;
    padding: 6px 12px; border-radius: 8px; max-width: 94vw; text-align: center; z-index: 99; }
  .c { transform: translate(-50%, -50%); }
  @keyframes bob { 0%, 100% { transform: translate(-50%, -50%) rotate(-3deg); } 50% { transform: translate(-50%, -56%) rotate(3deg); } }
  @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.12); } }
  @keyframes hop { 0%, 100% { transform: translate(-50%, -50%); } 40% { transform: translate(-50%, -95%) scale(1.15); } }
  @keyframes popin { 0% { transform: translate(-50%, -50%) scale(0); } 70% { transform: translate(-50%, -50%) scale(1.25); } 100% { transform: translate(-50%, -50%) scale(1); } }
  @keyframes twinkle { 0%, 100% { filter: drop-shadow(0 0 4px #fff6); } 50% { filter: drop-shadow(0 0 22px #ffe07a); } }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  .hop { animation: hop .6s ease-out; }
  .pop { animation: popin .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  .twinkle { animation: twinkle 2.2s ease-in-out infinite; }
  .num { position: absolute; transform: translate(-50%, -50%); font-weight: 800; color: #fff; display: flex; align-items: center;
    justify-content: center; text-shadow: 0 3px 0 #0005; pointer-events: none; }
  .disc { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; box-sizing: border-box; }
  .key { position: absolute; background: #fff; display: flex; align-items: center; justify-content: center; color: #2a8a6a; font-weight: 900; }
</style>
</head>
<body>
<div id="note"></div>
<div id="wrap"><div id="stage"></div></div>
<div id="bar"></div>
<script>
const A = '../../../../assets/';
const FR = ['crab', 'octopus', 'spouting_whale', 'whale', 'dolphin', 'fish', 'blowfish', 'shark', 'squid', 'lobster',
  'shrimp', 'oyster', 'seal', 'turtle', 'jellyfish', 'otter', 'penguin', 'duck', 'swan', 'flamingo'];
// Areas 1 to 4 of src/area.gd: deep and light water colours, the first Item kind, the music track.
const AREAS = [
  { deep: '#3fb4d8', light: '#7fd8ef', item: 'spiral_shell', music: 'lagoon' },
  { deep: '#2aa6a0', light: '#76d6c4', item: 'coral', music: 'coral_reef' },
  { deep: '#1f6fb5', light: '#5aa0dc', item: 'gem_stone', music: 'open_sea' },
  { deep: '#14284f', light: '#3a5a92', item: 'glowing_star', music: 'sea_at_night' },
];
const CHEST_CLOSED = A + 'sprites/goal/chest_closed.png';
const CHEST_OPEN = A + 'sprites/goal/chest_open.png';
const friend = (id) => A + 'sprites/friends/' + id + '.png';
const item = (kind) => A + 'sprites/items/' + kind + '.png';

const params = new URLSearchParams(location.search);
const state = {
  variant: params.get('variant') || 'B',
  screen: params.get('screen') || 'opening',
  n: Math.min(20, Math.max(1, +(params.get('n') || 7))),
  sound: false,
};
const stage = document.getElementById('stage');
let timers = [], tickers = [], parts = [], fxCtx = null, music = null, current = {};

// ---------- helpers ----------
function later(ms, fn) { timers.push(setTimeout(fn, ms)); }
function el(tag, cls, style, parent = stage) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  Object.assign(e.style, style || {});
  parent.appendChild(e);
  return e;
}
function img(src, x, y, w, cls = '', extra = {}) {
  const e = el('img', 'c ' + cls, { left: x + 'px', top: y + 'px', width: w + 'px', ...extra });
  e.src = src;
  return e;
}
function layer(z = 0) {
  const c = el('canvas', 'layer', { zIndex: z });
  c.width = 1600; c.height = 1000;
  return c.getContext('2d');
}
// The boat sprite points down at 0 degrees, like in the game.
function boat(x, y, w, deg = -90) {
  const d = el('div', 'bob', { position: 'absolute', left: x + 'px', top: y + 'px', width: w + 'px', height: w + 'px', transition: 'left 1.1s ease-in, top 1.1s ease-in' });
  const i = el('img', '', { left: 0, top: 0, width: '100%', height: '100%', objectFit: 'contain', transform: `rotate(${deg}deg)` }, d);
  i.src = A + 'kenney/ships/boat_white_sail.png';
  return d;
}
function num(text, x, y, size, style = {}) {
  const e = el('div', 'num', { left: x + 'px', top: y + 'px', fontSize: size + 'px', ...style });
  e.textContent = text;
  return e;
}
function keysHint(x, y, s = 1) {
  const g = el('div', 'pulse', { position: 'absolute', left: x + 'px', top: y + 'px', width: 206 * s + 'px', height: 136 * s + 'px', zIndex: 20 });
  [['▲', 1, 0], ['◀', 0, 1], ['▼', 1, 1], ['▶', 2, 1]].forEach(([ch, c, r]) => {
    el('div', 'key', { left: c * 72 * s + 'px', top: r * 72 * s + 'px', width: 62 * s + 'px', height: 62 * s + 'px', borderRadius: 12 * s + 'px',
      boxShadow: `0 ${6 * s}px 0 #8fb3ad`, fontSize: 28 * s + 'px' }, g).textContent = ch;
  });
  return g;
}
function water(ctx, deep, light, t, x = 0, y = 0, w = 1600, h = 1000) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = deep; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = light; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.globalAlpha = 0.7;
  for (let r = 0; r <= h / 70; r++) for (let c = -1; c <= w / 160; c++) {
    const px = x + c * 160 + (r % 2) * 80 + Math.sin(t * 0.8 + r) * 12, py = y + r * 70 + 30;
    ctx.beginPath(); ctx.arc(px, py, 18, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  ctx.restore();
}
function island(ctx, x, y, rx, ry) {
  ctx.fillStyle = '#f3dca0'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#79c267'; ctx.beginPath(); ctx.ellipse(x, y - ry * 0.12, rx * 0.78, ry * 0.68, 0, 0, 7); ctx.fill();
}
const STARS = Array.from({ length: 90 }, () => ({ x: Math.random() * 1600, y: Math.random() * 1000, p: Math.random() * 6, s: 1 + Math.random() * 2 }));
function stars(ctx, t, x0 = 0, y0 = 0, w = 1600, h = 1000) {
  ctx.fillStyle = '#fff';
  for (const s of STARS) {
    if (s.x < x0 || s.x > x0 + w || s.y < y0 || s.y > y0 + h) continue;
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 2 + s.p);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
const COLOURS = ['#ff5a5a', '#ffd54a', '#5ad1ff', '#7cff7a', '#ff8ad8'];
function confetti(x, y, n = 40) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 320 * (0.4 + Math.random() * 0.8);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 220, g: 380, life: 2.6, age: 0, col: COLOURS[i % 5], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10 });
  }
}
function firework(x, y, col) {
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * Math.PI * 2, s = 170 + Math.random() * 60;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 50, life: 1.3, age: 0, col, dot: true });
  }
}
function drawParts(ctx, dt) {
  ctx.clearRect(0, 0, 1600, 1000);
  parts = parts.filter((p) => (p.age += dt) < p.life);
  for (const p of parts) {
    if (p.dot) { p.vx *= 0.97; p.vy *= 0.97; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.min(1, (p.life - p.age) * 2);
    ctx.fillStyle = p.col;
    if (p.dot) { ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill(); }
    else { p.rot += p.vr * dt; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-5, -3, 10, 6); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
}
function play(id) {
  if (!state.sound) return;
  const a = new Audio(A + 'audio/friends/' + id + '.wav');
  a.volume = 0.6;
  a.onerror = () => sfx('splash');
  a.play().catch(() => {});
}
function sfx(name) {
  if (!state.sound) return;
  const a = new Audio(A + 'audio/effects/' + name + '.wav');
  a.volume = 0.5;
  a.play().catch(() => {});
}
function startMusic(track) {
  if (!state.sound) return;
  music = new Audio(A + 'audio/music/' + track + '.mp3');
  music.loop = true; music.volume = 0.3;
  music.play().catch(() => {});
}
function rehop(e) { e.classList.remove('hop'); void e.offsetWidth; e.classList.add('hop'); }
function bigStar(x, y, size, text) {
  img(item('star'), x, y, size, 'pop', { zIndex: 30 });
  later(150, () => num(text, x, y + size * 0.06, size * 0.32, { zIndex: 31, color: '#7a4a00', textShadow: '0 2px 0 #fff8' }));
}
const areaOf = (n) => Math.floor((n - 1) / 5);

// ---------- opening variants: the game logo and one big start button ----------
// Candidate names for the game. ?title= adds one more name at the start.
const NAMES = ['Sea Pals', 'Treasure Bay', 'Little Captain', 'Island Hop', 'Shell Quest'];
if (params.get('title')) NAMES.unshift(params.get('title'));
let nameIndex = 0;
const TITLE_OF = () => NAMES[nameIndex];
const ROUNDED = '"Arial Rounded MT Bold", ui-rounded, system-ui';
function title(x, y, size, fill, stroke, extra = {}) {
  const e = el('div', 'num', { left: x + 'px', top: y + 'px', fontSize: size + 'px', color: fill, fontFamily: ROUNDED,
    WebkitTextStroke: size / 9 + 'px ' + stroke, paintOrder: 'stroke fill', textShadow: `0 ${size / 14}px 0 #0004`, letterSpacing: '2px', zIndex: 20, ...extra });
  e.textContent = TITLE_OF();
  return e;
}
// One element for each letter, on a circle arc.
function archTitle(cx, cy, radius, size, fill, stroke, spread) {
  const letters = [...TITLE_OF()];
  letters.forEach((ch, i) => {
    const a = (-spread / 2 + spread * (letters.length === 1 ? 0.5 : i / (letters.length - 1))) * Math.PI / 180;
    el('div', 'num', { left: cx + radius * Math.sin(a) + 'px', top: cy - radius * Math.cos(a) + 'px', fontSize: size + 'px', color: fill, fontFamily: ROUNDED,
      WebkitTextStroke: size / 9 + 'px ' + stroke, paintOrder: 'stroke fill', textShadow: `0 ${size / 14}px 0 #0004`, transform: `translate(-50%, -50%) rotate(${a}rad)`, zIndex: 20 }).textContent = ch;
  });
}
// The big start button with a play triangle. In the game, any arrow key, Space, or Enter presses it.
function bigButton(x, y, w, h, colour, edge) {
  const wrap = el('div', 'pulse', { position: 'absolute', left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', zIndex: 25 });
  const face = el('div', '', { position: 'absolute', inset: 0, borderRadius: Math.min(w, h) / 2 + 'px', background: colour, border: '8px solid #fff', boxSizing: 'border-box',
    boxShadow: `0 ${h * 0.07}px 0 ${edge}, 0 18px 40px #0005`, display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'transform .12s' }, wrap);
  el('div', '', { width: 0, height: 0, borderTop: h * 0.22 + 'px solid transparent', borderBottom: h * 0.22 + 'px solid transparent',
    borderLeft: h * 0.34 + 'px solid #fff', marginLeft: h * 0.08 + 'px', filter: 'drop-shadow(0 4px 0 #0003)' }, face);
  current.button = face;
  return face;
}
// The boat sprite points down at 0 degrees, so the rotation for a heading (dx, dy) is atan2(dy, dx) - 90 degrees.
function steer(b, x, y, dx, dy) {
  b.style.left = x + 'px'; b.style.top = y + 'px';
  b.firstChild.style.transform = `rotate(${Math.atan2(dy, dx) - Math.PI / 2}rad)`;
}

const VA = {
  name: 'Title on the sea',
  opening: 'The title on the water. The boat sails around one round yellow button. Two Sea friends wait in the corners.',
  buildOpening() {
    const a = AREAS[0];
    const ctx = layer();
    tickers.push((t) => water(ctx, a.deep, a.light, t));
    title(800, 230, 200, '#fff', '#1f6fb5');
    bigButton(800, 640, 270, 270, '#ffd54a', '#d79a16');
    img(friend('crab'), 190, 840, 170, 'bob');
    img(friend('dolphin'), 1410, 830, 190, 'bob', { animationDelay: '.8s' });
    const b = boat(0, 0, 120);
    b.style.transition = 'none';
    tickers.push((t) => {
      const th = t * 0.55, rx = 360, ry = 175;
      steer(b, 800 + rx * Math.cos(th), 640 + ry * Math.sin(th), -rx * Math.sin(th), ry * Math.cos(th));
    });
    startMusic(a.music);
  },
};

const VB = {
  name: 'Chest logo',
  opening: 'The chest on its island is the logo, with the title in an arc over it. A wide green button sits under the island.',
  buildOpening() {
    const a = AREAS[1];
    const ctx = layer();
    tickers.push((t) => { water(ctx, a.deep, a.light, t); island(ctx, 800, 470, 300, 190); });
    img(CHEST_CLOSED, 800, 450, 260, 'twinkle');
    ['spiral_shell', 'starfish', 'pearl', 'coral'].forEach((kind, i) => img(item(kind), [600, 1000, 640, 965][i], [540, 540, 380, 380][i], 70, 'bob', { animationDelay: i * 0.5 + 's' }));
    const len = TITLE_OF().length;
    archTitle(800, 560, 420, len > 11 ? 105 : 130, '#ffe07a', '#7a4a24', Math.min(120, len * 8));
    bigButton(800, 820, 560, 160, '#5ccf6a', '#2f8f3c');
    startMusic(a.music);
  },
};

const VC = {
  name: 'Friends parade',
  opening: 'The title on a wooden sign. The boat leads a parade of Sea friends across the screen. One round coral button in the centre.',
  buildOpening() {
    const a = AREAS[2];
    const ctx = layer();
    tickers.push((t) => water(ctx, a.deep, a.light, t));
    el('div', '', { position: 'absolute', left: '800px', top: '190px', width: '920px', height: '210px', transform: 'translate(-50%, -50%) rotate(-2deg)',
      background: '#a8693a', border: '12px solid #7a4a24', borderRadius: '44px', boxShadow: '0 14px 0 #0004', zIndex: 15 });
    title(800, 190, 150, '#fff3d6', '#5a3416', { transform: 'translate(-50%, -50%) rotate(-2deg)' });
    bigButton(800, 610, 300, 300, '#ff7a59', '#c4492c');
    const b = boat(0, 0, 130);
    b.style.transition = 'none';
    const lane1 = ['crab', 'octopus', 'turtle', 'seal', 'penguin'].map((id) => img(friend(id), 0, 0, 110));
    const lane2 = ['flamingo', 'swan', 'duck', 'otter', 'jellyfish', 'whale'].map((id) => img(friend(id), 0, 0, 110));
    const wrap = (v) => ((v % 2100) + 2100) % 2100 - 250;
    tickers.push((t) => {
      const x0 = t * 110;
      steer(b, wrap(x0 + 5 * 230), 410, 1, 0);
      lane1.forEach((e, i) => { e.style.left = wrap(x0 + (4 - i) * 230) + 'px'; e.style.top = 410 + Math.sin(t * 3 + i) * 10 + 'px'; });
      lane2.forEach((e, i) => { e.style.left = wrap(-x0 + i * 330 + 400) + 'px'; e.style.top = 880 + Math.sin(t * 3 + i) * 10 + 'px'; e.style.transform = 'translate(-50%, -50%) scaleX(-1)'; });
    });
    startMusic(a.music);
  },
};

// ---------- end screen: the party (variant B of the first round) ----------
function buildParty() {
  const ctx = layer();
  tickers.push((t) => { water(ctx, AREAS[0].deep, AREAS[0].light, t); island(ctx, 800, 480, 260, 170); });
  const ch = img(CHEST_CLOSED, 800, 455, 190);
  current.boat = boat(800, 760, 150, 180);
  const ring = FR.map((id, k) => {
    const ang = (110 + k * (320 / 19)) * Math.PI / 180;
    return { e: img(friend(id), 800 + 650 * Math.cos(ang), 480 + 400 * Math.sin(ang), 100, 'pop', { animationDelay: k * 0.12 + 's' }), k };
  });
  later(400, () => {
    ch.src = CHEST_OPEN; sfx('goal'); confetti(800, 440, 70);
    ['spiral_shell', 'coral', 'gem_stone', 'glowing_star', 'pearl', 'starfish', 'sand_dollar', 'star'].forEach((kind, i) => {
      const it = img(item(kind), 800, 440, 64, '', { transition: 'left .7s cubic-bezier(.2,1.4,.5,1), top .7s cubic-bezier(.2,1.4,.5,1)' });
      const ang = (200 + i * 20) * Math.PI / 180;
      requestAnimationFrame(() => requestAnimationFrame(() => { it.style.left = 800 + 210 * Math.cos(ang) + 'px'; it.style.top = 470 + 150 * Math.sin(ang) + 20 + 'px'; }));
    });
  });
  ring.forEach(({ k }) => later(k * 120, () => play(FR[k])));
  later(20 * 120 + 600, () => {
    ring.forEach(({ e }) => e.classList.remove('pop'));
    tickers.push((t) => ring.forEach(({ e, k }) => {
      const off = Math.max(0, Math.sin(t * 4 - k * 0.45)) * 40;
      e.style.transform = `translate(-50%, calc(-50% - ${off}px))`;
    }));
    bigStar(800, 230, 190, '20');
  });
  const party = () => { confetti(300 + Math.random() * 1000, 200 + Math.random() * 400, 40); later(1500, party); };
  later(2000, party);
}
const PARTY_NOTE = 'End (chosen): all 20 Sea friends make a ring around the open chest and do a wave, again and again. Confetti falls.';

const VARIANTS = { A: VA, B: VB, C: VC };
const KEYS = Object.keys(VARIANTS);

// ---------- scene control ----------
function clearScene() {
  timers.forEach(clearTimeout); timers = []; tickers = []; parts = [];
  if (music) { music.pause(); music = null; }
  stage.innerHTML = ''; current = {};
}
function render() {
  clearScene();
  const v = VARIANTS[state.variant];
  if (state.screen === 'opening') v.buildOpening(); else buildParty();
  fxCtx = layer(50);
  const q = new URLSearchParams({ variant: state.variant, screen: state.screen });
  history.replaceState(null, '', '?' + q);
  document.getElementById('note').textContent = state.screen === 'opening' ? `Opening ${state.variant} (${v.name}): ${v.opening}` : PARTY_NOTE;
  drawBar();
}
// Space: on the opening, it presses the big button. On the end screen, it plays the end again.
function action() {
  if (state.screen === 'end') { render(); return; }
  const b = current.button;
  if (!b) return;
  b.style.transform = 'scale(.86)';
  sfx('item');
  later(140, () => { b.style.transform = 'scale(1)'; });
  const fade = el('div', '', { position: 'absolute', inset: 0, background: '#000', opacity: 0, transition: 'opacity .8s .3s', zIndex: 60 });
  requestAnimationFrame(() => requestAnimationFrame(() => { fade.style.opacity = 1; }));
  later(1500, render);
}
function drawBar() {
  const bar = document.getElementById('bar');
  bar.innerHTML = '';
  const btn = (label, on, fn) => { const b = el('button', on ? 'on' : '', {}, bar); b.textContent = label; b.onclick = fn; return b; };
  const sep = () => el('span', 'sep', {}, bar);
  if (state.screen === 'opening') {
    btn('◀', false, () => cycle(-1));
    el('b', '', { minWidth: '190px', textAlign: 'center' }, bar).textContent = `${state.variant} (${VARIANTS[state.variant].name})`;
    btn('▶', false, () => cycle(1));
    sep();
  }
  if (state.screen === 'opening') {
    btn(`Name: ${TITLE_OF()} ▸`, false, () => { nameIndex = (nameIndex + 1) % NAMES.length; render(); });
    sep();
  }
  btn('Opening', state.screen === 'opening', () => { state.screen = 'opening'; render(); });
  btn('End', state.screen === 'end', () => { state.screen = 'end'; render(); });
  sep();
  btn(state.sound ? 'Sound on' : 'Sound off', state.sound, () => { state.sound = !state.sound; render(); });
  btn(state.screen === 'opening' ? 'Press button (Space)' : 'Replay (Space)', false, action);
}
function cycle(d) {
  const i = KEYS.indexOf(state.variant);
  state.variant = KEYS[(i + d + KEYS.length) % KEYS.length];
  render();
}
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === ' ') { e.preventDefault(); action(); }
});
function fit() {
  const s = Math.min(innerWidth / 1600, (innerHeight - 120) / 1000);
  stage.style.transform = `scale(${s})`;
  stage.style.margin = `${-500 * (1 - s)}px ${-800 * (1 - s)}px`;
}
addEventListener('resize', fit);
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  tickers.forEach((f) => f(t, dt));
  if (fxCtx) drawParts(fxCtx, dt);
  requestAnimationFrame(loop);
}
fit(); render(); requestAnimationFrame(loop);
</script>
</body>
</html>
