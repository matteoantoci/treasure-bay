<!doctype html>
<!-- PROTOTYPE, throwaway. Answers ticket 03: how the boat moves with the arrow keys.
     Browser stand-in for Godot: same rules (tween per move, input lock, one buffered press, is_echo). -->
<html>
<head>
<meta charset="utf-8">
<title>PROTOTYPE movement</title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: linear-gradient(#bfe9ff, #7cc8f0); }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; }
  svg { max-width: 92vw; max-height: 76vh; }
  #bar { display: flex; gap: 8px; padding: 10px; background: #222; justify-content: center; flex-wrap: wrap; align-items: center; }
  #bar button { font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 0; cursor: pointer; }
  #bar button.on { outline: 3px solid #ffd54a; }
  #bar label { color: #eee; font-size: 14px; }
  #state { color: #ddd; font: 12px ui-monospace, monospace; width: 100%; text-align: center; }
</style>
</head>
<body>
<div id="stage"><svg id="svg"></svg></div>
<div id="bar"></div>
<script>
const E = (n) => `https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/${encodeURIComponent(n)}/3D/${n.toLowerCase().replace(/ /g,'_')}_3d.png`;
const BOAT = E('Sailboat'), ISLAND = E('Desert island'), SHELL = E('Spiral shell');

const MODES = {
  step: 'A: one press = one square',
  junction: 'B: one press = slide to next junction',
  hold: 'C: hold key = keep moving',
};
const WALLS = {
  bump: 'Wall: small bump + shake',
  nothing: 'Wall: nothing happens',
};
const SPEEDS = { slow: 260, medium: 180, fast: 120 };

const W = 7, H = 5, C = 110;
function maze(seed) {
  let s = seed; const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const cells = Array.from({length: W*H}, () => ({n:1,e:1,s:1,w:1,v:0}));
  const st = [0]; cells[0].v = 1;
  while (st.length) {
    const i = st.at(-1), x = i % W, y = (i / W) | 0, nb = [];
    if (y>0 && !cells[i-W].v) nb.push(['n', i-W, 's']);
    if (x<W-1 && !cells[i+1].v) nb.push(['e', i+1, 'w']);
    if (y<H-1 && !cells[i+W].v) nb.push(['s', i+W, 'n']);
    if (x>0 && !cells[i-1].v) nb.push(['w', i-1, 'e']);
    if (!nb.length) { st.pop(); continue; }
    const [d, j, o] = nb[(rnd()*nb.length)|0];
    cells[i][d] = 0; cells[j][o] = 0; cells[j].v = 1; st.push(j);
  }
  return cells;
}

const params = new URLSearchParams(location.search);
let mode = params.get('mode') in MODES ? params.get('mode') : 'step';
let wall = params.get('wall') in WALLS ? params.get('wall') : 'bump';
let speed = params.get('speed') in SPEEDS ? params.get('speed') : 'medium';
let seed = 7, cells, pos, items, busy, buffered, held, moves, bumps, won, facing;

const DIRS = { ArrowUp: ['n',0,-1], ArrowDown: ['s',0,1], ArrowLeft: ['w',-1,0], ArrowRight: ['e',1,0] };

function reset() {
  cells = maze(seed); pos = {x:0,y:0}; items = new Set(['2,1','5,2','1,3']);
  busy = false; buffered = null; held = null; moves = 0; bumps = 0; won = false; facing = 1;
  draw(); bar();
}

function open(x, y, d) { return !cells[y*W+x][d]; }
function exits(x, y) { return ['n','e','s','w'].filter(d => open(x, y, d)).length; }

function draw(off = {x:0,y:0}, scaleX = 1) {
  let s = `<rect width="${W*C}" height="${H*C}" rx="18" fill="#d9f3ff"/>`;
  cells.forEach((c, i) => {
    const x = (i % W) * C, y = ((i / W) | 0) * C;
    const L = (a,b,cc,d) => s += `<line x1="${a}" y1="${b}" x2="${cc}" y2="${d}" stroke="#2f8fd0" stroke-width="10" stroke-linecap="round"/>`;
    if (c.n) L(x,y,x+C,y); if (c.w) L(x,y,x,y+C);
    if (i % W === W-1 && c.e) L(x+C,y,x+C,y+C);
    if (((i / W)|0) === H-1 && c.s) L(x,y+C,x+C,y+C);
  });
  for (const k of items) { const [x,y] = k.split(',').map(Number); s += `<image href="${SHELL}" x="${x*C+23}" y="${y*C+23}" width="64" height="64"/>`; }
  s += `<image href="${ISLAND}" x="${(W-1)*C+7}" y="${(H-1)*C+7}" width="96" height="96"/>`;
  const bx = pos.x*C + off.x, by = pos.y*C + off.y;
  s += `<g transform="translate(${bx+C/2} ${by+C/2}) scale(${facing*scaleX} 1)"><image href="${BOAT}" x="-45" y="-45" width="90" height="90"/></g>`;
  if (won) s += `<text x="${W*C/2}" y="${H*C/2}" font-size="120" text-anchor="middle">🎉</text>`;
  const svg = document.getElementById('svg');
  svg.setAttribute('viewBox', `-20 -20 ${W*C+40} ${H*C+40}`);
  svg.setAttribute('width', W*C+40); svg.setAttribute('height', H*C+40);
  svg.innerHTML = s;
  const st = document.getElementById('state');
  if (st) st.textContent = `mode=${mode} wall=${wall} speed=${speed} pos=(${pos.x},${pos.y}) moves=${moves} bumps=${bumps} busy=${busy} buffered=${buffered ?? '-'} held=${held ?? '-'} shells left=${items.size}`;
}

function tween(from, to, ms, frame) {
  return new Promise(res => {
    const t0 = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);
    (function tick(now) {
      const t = Math.min(1, (now - t0) / ms);
      frame(from + (to - from) * ease(t));
      t < 1 ? requestAnimationFrame(tick) : res();
    })(t0);
  });
}

async function bump(dx, dy) {
  bumps++;
  if (wall === 'nothing') { draw(); return; }
  await tween(0, 1, 90, k => draw({x: dx*14*k, y: dy*14*k}));
  await tween(1, 0, 120, k => draw({x: dx*14*k, y: dy*14*k}));
}

async function stepOnce(key) {
  const [d, dx, dy] = DIRS[key];
  if (dx) facing = dx;
  if (!open(pos.x, pos.y, d)) { await bump(dx, dy); return false; }
  const ms = SPEEDS[speed];
  await tween(0, C, ms, v => draw({x: dx*v, y: dy*v}));
  pos = {x: pos.x+dx, y: pos.y+dy}; moves++;
  items.delete(`${pos.x},${pos.y}`);
  draw();
  if (pos.x === W-1 && pos.y === H-1) { won = true; draw(); }
  return true;
}

async function act(key) {
  if (won) return;
  busy = true;
  if (mode === 'junction') {
    // Slide until a junction, a dead end, an item, or the Goal.
    let first = true;
    while (true) {
      const ok = await stepOnce(key);
      if (!ok || won) break;
      first = false;
      const [d] = DIRS[key];
      if (exits(pos.x, pos.y) !== 2 || !open(pos.x, pos.y, d)) break;
    }
  } else if (mode === 'hold') {
    await stepOnce(key);
    while (held === key && !won) { if (!(await stepOnce(key))) break; }
  } else {
    await stepOnce(key);
  }
  busy = false;
  if (buffered && !won) { const k = buffered; buffered = null; act(k); }
  draw();
}

addEventListener('keydown', e => {
  if (!(e.key in DIRS)) { if (e.key === 'r') reset(); return; }
  e.preventDefault();
  if (e.repeat) { if (mode === 'hold') held = e.key; return; }  // is_echo(): ignore repeats except in hold mode
  held = e.key;
  if (busy) { buffered = e.key; draw(); return; }               // keep one early press
  act(e.key);
});
addEventListener('keyup', e => { if (held === e.key) held = null; });

function bar() {
  const b = document.getElementById('bar');
  const grp = (obj, cur, name) => Object.entries(obj).map(([k, v]) =>
    `<button data-g="${name}" data-k="${k}" class="${k===cur?'on':''}">${typeof v === 'number' ? k : v}</button>`).join('');
  b.innerHTML = grp(MODES, mode, 'mode') + ' | ' + grp(WALLS, wall, 'wall') + ' | ' + grp(SPEEDS, speed, 'speed') +
    ` <button id="new">New Labyrinth</button> <label>R = restart</label><div id="state"></div>`;
  b.querySelectorAll('button[data-g]').forEach(el => el.onclick = () => {
    if (el.dataset.g === 'mode') mode = el.dataset.k;
    if (el.dataset.g === 'wall') wall = el.dataset.k;
    if (el.dataset.g === 'speed') speed = el.dataset.k;
    history.replaceState(null, '', `?mode=${mode}&wall=${wall}&speed=${speed}`);
    el.blur(); reset();
  });
  b.querySelector('#new').onclick = (e) => { seed++; e.target.blur(); reset(); };
  draw();
}
reset();
</script>
</body>
</html>
