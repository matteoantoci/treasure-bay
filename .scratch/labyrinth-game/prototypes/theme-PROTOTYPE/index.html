<!doctype html>
<!-- PROTOTYPE, throwaway. Answers ticket 02: sea or space theme. Open this file in a browser. -->
<html>
<head>
<meta charset="utf-8">
<title>PROTOTYPE theme mockups</title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  svg.maze { max-width: 92vw; max-height: 80vh; }
  .reward { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; }
  .reward.on { display: flex; }
  .reward .big { width: 220px; animation: pop .8s ease-out infinite alternate; }
  .reward .ring img { width: 72px; position: absolute; animation: spin 3s linear infinite; }
  @keyframes pop { from { transform: scale(.9) rotate(-4deg); } to { transform: scale(1.08) rotate(4deg); } }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  #bar { display: flex; gap: 8px; padding: 10px; background: #222; justify-content: center; flex-wrap: wrap; }
  #bar button { font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 0; cursor: pointer; }
  #bar button.on { outline: 3px solid #ffd54a; }
  #info { color: #ddd; font-size: 13px; align-self: center; margin-left: 12px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<script>
const E = (n) => `https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/${encodeURIComponent(n)}/3D/${n.toLowerCase().replace(/ /g,'_')}_3d.png`;

const VARIANTS = {
  'sea': {
    label: 'Sea (light)', bg: 'linear-gradient(#bfe9ff, #7cc8f0)', floor: '#d9f3ff', wall: '#2f8fd0', wallW: 10,
    char: E('Sailboat'), goal: E('Desert island'), items: [E('Spiral shell'), E('Tropical fish'), E('Spiral shell')],
    deco: E('Water wave'), reward: [E('Rainbow'), E('Tropical fish'), E('Dolphin'), E('Sparkles')], rot: 0,
  },
  'sea-sand': {
    label: 'Sea (sand paths)', bg: 'linear-gradient(#ffe9c4, #ffd59a)', floor: '#fff4dc', wall: '#3fb6a8', wallW: 14,
    char: E('Sailboat'), goal: E('Desert island'), items: [E('Spiral shell'), E('Dolphin'), E('Spiral shell')],
    deco: E('Water wave'), reward: [E('Rainbow'), E('Spiral shell'), E('Party popper'), E('Sparkles')], rot: 0,
  },
  'space': {
    label: 'Space (night)', bg: 'radial-gradient(circle at 30% 20%, #3b2a7a, #120b2e)', floor: '#241a52', wall: '#b79cff', wallW: 10,
    char: E('Rocket'), goal: E('Ringed planet'), items: [E('Glowing star'), E('Crescent moon'), E('Glowing star')],
    deco: E('Comet'), reward: [E('Shooting star'), E('Glowing star'), E('Gem stone'), E('Sparkles')], rot: -45,
  },
  'space-pastel': {
    label: 'Space (pastel)', bg: 'linear-gradient(#f3d9ff, #c7d2ff)', floor: '#fbf2ff', wall: '#9a6bff', wallW: 14,
    char: E('Rocket'), goal: E('Ringed planet'), items: [E('Glowing star'), E('Comet'), E('Glowing star')],
    deco: E('Crescent moon'), reward: [E('Rainbow'), E('Glowing star'), E('Party popper'), E('Sparkles')], rot: -45,
  },
};

// Fixed 7x5 Labyrinth from a seeded recursive backtracker (the real generator choice).
function maze(w, h, seed) {
  let s = seed; const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const cells = Array.from({length: w*h}, () => ({n:1,e:1,s:1,w:1,v:0}));
  const st = [0]; cells[0].v = 1;
  while (st.length) {
    const i = st[st.length-1], x = i % w, y = (i / w) | 0;
    const nb = [];
    if (y>0 && !cells[i-w].v) nb.push(['n', i-w, 's']);
    if (x<w-1 && !cells[i+1].v) nb.push(['e', i+1, 'w']);
    if (y<h-1 && !cells[i+w].v) nb.push(['s', i+w, 'n']);
    if (x>0 && !cells[i-1].v) nb.push(['w', i-1, 'e']);
    if (!nb.length) { st.pop(); continue; }
    const [d, j, o] = nb[(rnd()*nb.length)|0];
    cells[i][d] = 0; cells[j][o] = 0; cells[j].v = 1; st.push(j);
  }
  return cells;
}

const W = 7, H = 5, C = 110;
const cells = maze(W, H, 7);

function render(key, showReward) {
  const v = VARIANTS[key];
  const stage = document.getElementById('stage');
  stage.style.background = v.bg;
  let s = `<svg class="maze" viewBox="-20 -20 ${W*C+40} ${H*C+40}" width="${W*C+40}" height="${H*C+40}">`;
  s += `<rect x="0" y="0" width="${W*C}" height="${H*C}" rx="18" fill="${v.floor}"/>`;
  cells.forEach((c, i) => {
    const x = (i % W) * C, y = ((i / W) | 0) * C;
    const L = (x1,y1,x2,y2) => s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${v.wall}" stroke-width="${v.wallW}" stroke-linecap="round"/>`;
    if (c.n) L(x,y,x+C,y); if (c.w) L(x,y,x,y+C);
    if (i % W === W-1 && c.e) L(x+C,y,x+C,y+C);
    if (((i / W)|0) === H-1 && c.s) L(x,y+C,x+C,y+C);
  });
  const img = (href, cx, cy, size, rot=0, op=1) =>
    s += `<image href="${href}" x="${cx*C+(C-size)/2}" y="${cy*C+(C-size)/2}" width="${size}" height="${size}" opacity="${op}" transform="rotate(${rot} ${cx*C+C/2} ${cy*C+C/2})"/>`;
  img(v.deco, 3, 0, 60, 0, .35); img(v.deco, 1, 4, 60, 0, .35);
  [[2,1],[5,2],[1,3]].forEach(([x,y], k) => img(v.items[k], x, y, 64));
  img(v.goal, W-1, H-1, 96);
  img(v.char, 0, 0, 90, v.rot);
  s += `</svg>`;
  const r = v.reward;
  s += `<div class="reward ${showReward ? 'on' : ''}" style="background:${v.bg}">
    <img class="big" src="${v.goal}">
    <div style="position:relative;width:420px;height:120px">
      ${r.map((h, k) => `<img src="${h}" style="position:absolute;width:90px;left:${k*110}px;top:${k%2?30:0}px;animation:pop ${.6+k*.15}s ease-out infinite alternate">`).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">${v.items.map(h => `<img src="${h}" width="70">`).join('')}</div>
  </div>`;
  stage.innerHTML = s;
}

const params = new URLSearchParams(location.search);
let cur = params.get('v') in VARIANTS ? params.get('v') : 'sea';
let rew = params.get('reward') === '1';

function bar() {
  const b = document.getElementById('bar');
  b.innerHTML = Object.entries(VARIANTS).map(([k, v]) =>
    `<button data-k="${k}" class="${k===cur?'on':''}">${v.label}</button>`).join('') +
    `<button id="rw" class="${rew?'on':''}">${rew ? 'Show Labyrinth' : 'Show reward screen'}</button>` +
    `<span id="info">variant: ${cur} · reward: ${rew}</span>`;
  b.querySelectorAll('button[data-k]').forEach(el => el.onclick = () => { cur = el.dataset.k; go(); });
  b.querySelector('#rw').onclick = () => { rew = !rew; go(); };
}
function go() {
  history.replaceState(null, '', `?v=${cur}&reward=${rew?1:0}`);
  render(cur, rew); bar();
}
go();
</script>
</body>
</html>
