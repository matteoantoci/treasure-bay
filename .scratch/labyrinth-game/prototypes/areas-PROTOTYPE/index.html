<!doctype html>
<!-- PROTOTYPE, throwaway. Answers ticket 08: what changes in the look between Labyrinths. Open this file in a browser. -->
<html>
<head>
<meta charset="utf-8">
<title>PROTOTYPE visual change between Labyrinths</title>
<style>
  html, body { margin: 0; font-family: system-ui, sans-serif; background: #222; color: #eee; }
  #bar { display: flex; gap: 8px; padding: 10px; justify-content: center; flex-wrap: wrap; }
  #bar button { font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 0; cursor: pointer; }
  #bar button.on { outline: 3px solid #ffd54a; }
  #note { text-align: center; font-size: 14px; color: #bbb; padding: 0 10px 8px; }
  #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
  .step { border-radius: 14px; overflow: hidden; position: relative; aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; }
  .step svg { width: 92%; height: 88%; }
  .tag { position: absolute; top: 6px; left: 10px; font-size: 13px; background: #0008; padding: 2px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="note"></div>
<div id="grid"></div>
<script>
const E = (n) => `https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/${encodeURIComponent(n)}/3D/${n.toLowerCase().replace(/ /g,'_')}_3d.png`;

// Each step: bg, floor, wall, boat, items, deco, goal, glow (night stars).
const base = { bg: 'linear-gradient(#bfe9ff, #7cc8f0)', floor: '#d9f3ff', wall: '#2f8fd0', boat: 'Sailboat', items: ['Spiral shell','Tropical fish'], deco: 'Water wave', goal: 'Desert island' };
const OPTIONS = {
  areas: {
    label: 'A. Sea Areas (every 5 Labyrinths)',
    note: 'Each Area has its own colours, Items, and decoration. Matches the 4 Areas and the 4 music tracks. Recommended.',
    steps: [
      { tag: 'Area 1: lagoon', ...base },
      { tag: 'Area 2: coral reef', bg: 'linear-gradient(#ffe9c4, #ffc9a8)', floor: '#fff4dc', wall: '#e0708a', boat: 'Sailboat', items: ['Coral','Tropical fish'], deco: 'Bubbles', goal: 'Desert island' },
      { tag: 'Area 3: open sea', bg: 'linear-gradient(#5fa8e0, #1f5f9e)', floor: '#cfe6f7', wall: '#16497a', boat: 'Sailboat', items: ['Gem stone','Spiral shell'], deco: 'Droplet', goal: 'Desert island' },
      { tag: 'Area 4: sea at night', bg: 'radial-gradient(circle at 30% 20%, #2c3f7a, #0d1533)', floor: '#2a3a66', wall: '#9fd4ff', boat: 'Sailboat', items: ['Glowing star','Star'], deco: 'Crescent moon', goal: 'Desert island', glow: true },
    ],
  },
  boat: {
    label: 'B. New boat',
    note: 'The colours stay. The boat changes after some Labyrinths.',
    steps: ['Canoe','Sailboat','Speedboat','Ship'].map((b, k) => ({ tag: `Labyrinths ${k*5+1}-${k*5+5}: ${b.toLowerCase()}`, ...base, boat: b })),
  },
  time: {
    label: 'C. Time of day',
    note: 'Same sea. The sky goes from morning to night.',
    steps: [
      { tag: 'Morning', ...base, bg: 'linear-gradient(#fff3c4, #bfe9ff)', deco: 'Sun' },
      { tag: 'Midday', ...base, deco: 'Sun with face' },
      { tag: 'Sunset', ...base, bg: 'linear-gradient(#ffb36b, #e0607a)', floor: '#ffe6d6', wall: '#b04a6a', deco: 'Sunset' },
      { tag: 'Night', ...base, bg: 'radial-gradient(circle at 30% 20%, #2c3f7a, #0d1533)', floor: '#2a3a66', wall: '#9fd4ff', deco: 'Crescent moon', glow: true },
    ],
  },
  hue: {
    label: 'D. Small colour change each Labyrinth',
    note: 'Wall and floor colours move a little each time. No new art.',
    steps: [0, 25, 50, 75].map((h, k) => ({ tag: `Labyrinth ${k+1}`, ...base,
      bg: `linear-gradient(hsl(${200+h} 80% 85%), hsl(${200+h} 70% 70%))`, floor: `hsl(${200+h} 80% 93%)`, wall: `hsl(${205+h} 65% 50%)` })),
  },
};

function maze(w, h, seed) {
  let s = seed; const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const cells = Array.from({length: w*h}, () => ({n:1,e:1,s:1,w:1,v:0}));
  const st = [0]; cells[0].v = 1;
  while (st.length) {
    const i = st[st.length-1], x = i % w, y = (i / w) | 0, nb = [];
    if (y>0 && !cells[i-w].v) nb.push(['n', i-w, 's']);
    if (x<w-1 && !cells[i+1].v) nb.push(['e', i+1, 'w']);
    if (y<h-1 && !cells[i+w].v) nb.push(['s', i+w, 'n']);
    if (x>0 && !cells[i-1].v) nb.push(['w', i-1, 'e']);
    if (!nb.length) { st.pop(); continue; }
    const [d, j, o] = nb[(rnd()*nb.length)|0];
    cells[i][d] = 0; cells[j][o] = 0; cells[j].v = 1; st.push(j);
  }
  return cells;
}

const W = 7, H = 5, C = 110;
function panel(v, seed) {
  const cells = maze(W, H, seed);
  let s = `<svg viewBox="-20 -20 ${W*C+40} ${H*C+40}">`;
  if (v.glow) for (let k = 0; k < 14; k++) s += `<circle cx="${(k*137)%(W*C)}" cy="${(k*89)%(H*C)}" r="3" fill="#fff8" />`;
  s += `<rect width="${W*C}" height="${H*C}" rx="18" fill="${v.floor}"/>`;
  cells.forEach((c, i) => {
    const x = (i % W) * C, y = ((i / W) | 0) * C;
    const L = (a,b,c2,d) => s += `<line x1="${a}" y1="${b}" x2="${c2}" y2="${d}" stroke="${v.wall}" stroke-width="12" stroke-linecap="round"/>`;
    if (c.n) L(x,y,x+C,y); if (c.w) L(x,y,x,y+C);
    if (i % W === W-1 && c.e) L(x+C,y,x+C,y+C);
    if (((i / W)|0) === H-1 && c.s) L(x,y+C,x+C,y+C);
  });
  const img = (n, cx, cy, size, op=1) => s += `<image href="${E(n)}" x="${cx*C+(C-size)/2}" y="${cy*C+(C-size)/2}" width="${size}" height="${size}" opacity="${op}"/>`;
  img(v.deco, 3, 0, 64, .45); img(v.deco, 1, 4, 64, .45);
  img(v.items[0], 2, 1, 64); img(v.items[1], 5, 2, 64); img(v.items[0], 1, 3, 64);
  img(v.goal, W-1, H-1, 96); img(v.boat, 0, 0, 90);
  return s + `</svg>`;
}

let cur = new URLSearchParams(location.search).get('o');
if (!(cur in OPTIONS)) cur = 'areas';
function go() {
  history.replaceState(null, '', `?o=${cur}`);
  const o = OPTIONS[cur];
  document.getElementById('bar').innerHTML = Object.entries(OPTIONS).map(([k, x]) =>
    `<button data-k="${k}" class="${k===cur?'on':''}">${x.label}</button>`).join('');
  document.querySelectorAll('#bar button').forEach(b => b.onclick = () => { cur = b.dataset.k; go(); });
  document.getElementById('note').textContent = o.note;
  document.getElementById('grid').innerHTML = o.steps.map((v, k) =>
    `<div class="step" style="background:${v.bg}"><span class="tag">${v.tag}</span>${panel(v, 7 + k*3)}</div>`).join('');
}
go();
</script>
</body>
</html>
