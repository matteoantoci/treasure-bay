<!doctype html><meta charset=utf-8><title>Listen to the sounds, round 3</title>
<style>body{font:15px system-ui;max-width:900px;margin:2em auto}.r{border:1px solid #ccc;border-radius:8px;padding:10px;margin:8px 0}
audio{height:32px;vertical-align:middle}label{margin-right:12px}h2{margin-top:1.5em}small{color:#666}.c{margin:6px 0;padding:6px;border-top:1px dashed #ddd}</style>
<h1>Listen to the sounds, round 3 (ticket 12)</h1>
<p>Music: 3 new joyful tracks for each Area, or reuse a kept track. Sea friends: "use the splash" is preselected; 2 new cartoon sounds each. All audio files are local, in clips/.</p>
<div id=list></div><button id=copy style="font-size:18px;padding:8px 16px">Copy answers</button> <span id=ok></span>
<textarea id=out rows=14 style="width:100%;margin-top:8px;display:none" readonly></textarea>
<script>const R=[{"sec": "Music", "name": "Open sea", "music": true, "c": [{"title": "Fairy Land", "author": "AndriiComposer", "lic": "Pixabay Content License", "len": "2:45", "url": "https://pixabay.com/music/happy-childrens-tunes-fairy-land-440535/", "src": "clips/r3_music_happy-childrens-tunes-fairy-land-440535.mp3", "note": "tags: calm, kids, ocean, sea, ukulele (same tags as Ocean Joy)"}, {"title": "Have a Good Day", "author": "AndriiComposer", "lic": "Pixabay Content License", "len": "1:57", "url": "https://pixabay.com/music/happy-childrens-tunes-have-a-good-day-434738/", "src": "clips/r3_music_happy-childrens-tunes-have-a-good-day-434738.mp3", "note": "mood: laid back, bright, happy"}, {"title": "Happy Kids", "author": "AndriiComposer", "lic": "Pixabay Content License", "len": "2:09", "url": "https://pixabay.com/music/happy-childrens-tunes-happy-kids-434747/", "src": "clips/r3_music_happy-childrens-tunes-happy-kids-434747.mp3", "note": "mood: bright, laid back, happy"}]}, {"sec": "Music", "name": "Sea at night", "music": true, "c": [{"title": "Cloud of Dreams", "author": "AndriiComposer", "lic": "Pixabay Content License", "len": "2:32", "url": "https://pixabay.com/music/acoustic-group-cloud-of-dreams-380619/", "src": "clips/r3_music_acoustic-group-cloud-of-dreams-380619.mp3", "note": "mood: laid back, bright, happy"}, {"title": "Beautiful Dreams", "author": "AndriiComposer", "lic": "Pixabay Content License", "len": "3:13", "url": "https://pixabay.com/music/acoustic-group-beautiful-dreams-440528/", "src": "clips/r3_music_acoustic-group-beautiful-dreams-440528.mp3", "note": "mood: laid back, bright, uplifting"}, {"title": "Carefree", "author": "Pavetraxx", "lic": "Pixabay Content License", "len": "1:25", "url": "https://pixabay.com/music/acoustic-group-carefree-265435/", "src": "clips/r3_music_acoustic-group-carefree-265435.mp3", "note": "tags: gentle, calm, children, ukulele, happy"}]}, {"sec": "Sea friends", "name": "Spouting whale", "c": [{"title": "S36-05 Whale spouting (not real); or small rocket launch.wav", "author": "craigsmith", "lic": "CC0", "len": "3.0 s, cut to 2.5 s", "url": "https://freesound.org/people/craigsmith/sounds/675399/", "src": "clips/r3_sw_craig.mp3", "cut": "0:00.5 to 0:03.0", "note": "cartoon whale spout"}, {"title": "S34-17 Wacky comedy bit; steam spraying out of ears.wav", "author": "craigsmith", "lic": "CC0", "len": "7.0 s, cut to 2.5 s", "url": "https://freesound.org/people/craigsmith/sounds/676006/", "src": "clips/r3_sw_steam.mp3", "cut": "0:00.25 to 0:02.75", "note": "cartoon steam burst"}]}, {"sec": "Sea friends", "name": "Whale", "c": [{"title": "Whalesong.wav", "author": "taure", "lic": "CC0", "len": "46.4 s, cut to 2.5 s", "url": "https://freesound.org/people/taure/sounds/361423/", "src": "clips/r3_wh_taure.mp3", "cut": "0:33.0 to 0:35.5", "note": "a voice that copies a whale call"}, {"title": "Whale.wav", "author": "claretcanelon", "lic": "CC0", "len": "6.6 s, cut to 2.5 s", "url": "https://freesound.org/people/claretcanelon/sounds/458626/", "src": "clips/r3_wh_claret.mp3", "cut": "0:01.3 to 0:03.8", "note": "a voice that copies a whale"}]}, {"sec": "Sea friends", "name": "Blowfish", "c": [{"title": "TOONMisc-Samsung Galaxy Smartphone, CU_Slime, Inflate, Resonant_Nicholas Judy_TDC", "author": "designerschoice", "lic": "CC BY 4.0 (credit necessary)", "len": "5.0 s, cut to 2.5 s", "url": "https://freesound.org/people/designerschoice/sounds/851444/", "src": "clips/r3_bf_slime.mp3", "cut": "0:01.95 to 0:04.45", "note": "cartoon slime inflating"}, {"title": "Pops - Mouth", "author": "JelloApocalypse", "lic": "CC0", "len": "8.6 s, cut to 2.5 s", "url": "https://freesound.org/people/JelloApocalypse/sounds/802606/", "src": "clips/r3_bf_jello.mp3", "cut": "0:05.7 to 0:08.2", "note": "cartoon mouth pops"}]}, {"sec": "Sea friends", "name": "Octopus", "c": [{"title": "Cartoon - Smoochy Squeak + Plop", "author": "Breviceps", "lic": "CC0", "len": "0.7 s", "url": "https://freesound.org/people/Breviceps/sounds/444494/", "src": "clips/r3_oc_smooch.mp3", "cut": "whole file", "note": "cartoon smoochy squeak and plop"}, {"title": "Plop!", "author": "Breviceps", "lic": "CC0", "len": "0.2 s", "url": "https://freesound.org/people/Breviceps/sounds/447910/", "src": "clips/r3_oc_plop.mp3", "cut": "whole file", "note": "cartoon plop"}]}, {"sec": "Sea friends", "name": "Jellyfish", "c": [{"title": "Cute Anime Jumps", "author": "plasterbrain", "lic": "CC0", "len": "1.7 s", "url": "https://freesound.org/people/plasterbrain/sounds/396196/", "src": "clips/r3_jf_anime.mp3", "cut": "whole file", "note": "cute synth boing, 4 bounces"}, {"title": "Bubble.wav", "author": "megmcduffee", "lic": "CC0", "len": "9.5 s, cut to 2.5 s", "url": "https://freesound.org/people/megmcduffee/sounds/332597/", "src": "clips/r3_jf_bubble.mp3", "cut": "0:06.85 to 0:09.35", "note": "bouncy plastic wobble"}]}];const SPL={"title": "Splash", "author": "swordofkings128", "lic": "CC0", "len": "1.3 s", "url": "https://freesound.org/people/swordofkings128/sounds/398032/", "src": "clips/r3_splash.mp3"};const KEPT=["Ocean Joy","Marine Melody"];
R.push(...[["Duck","single quack from a duck","Mikes-MultiMedia","0.8 s","https://freesound.org/people/Mikes-MultiMedia/sounds/418509/","clips/r3_duck.mp3"],["Frog","Frog croaking sound effect","betterchinese","2.0 s","https://freesound.org/people/betterchinese/sounds/354132/","clips/r3_frog.mp3"]].map(([name,title,author,len,url,src])=>({sec:"Sea friends",name,pre:0,c:[{title,author,lic:"CC0",len,url,src,cut:"whole file",note:"first pick, not heard yet"}]})));
const info=c=>`<b>${c.title}</b> by ${c.author} <small>| ${c.lic} | ${c.len}${c.cut?` | ${c.cut}`:''}${c.note?` | ${c.note}`:''} | <a href="${c.url}" target=_blank>page</a></small>`;
let sec='',h='';R.forEach((r,i)=>{if(r.sec!=sec){sec=r.sec;h+=`<h2>${sec}</h2>`}
h+=`<div class=r><b style="font-size:17px">${r.name}</b>`;
if(!r.music)h+=`<div class=c><label><input type=radio name=k${i} value=splash ${r.pre==null?'checked':''}>use the splash</label> ${info(SPL)}<br><audio controls preload=none src="${SPL.src}"></audio></div>`;
r.c.forEach((c,j)=>h+=`<div class=c><label><input type=radio name=k${i} value=${j} ${r.pre===j?'checked':''}>${r.pre===j?'keep':'candidate '+(j+1)}</label> ${info(c)}<br><audio controls preload=none src="${c.src}"></audio></div>`);
h+=`<div class=c><label><input type=radio name=k${i} value=none>none of these</label>`;
if(r.music)h+=`<label><input type=radio name=k${i} value=kept>reuse a kept track</label><select id=s${i}>${KEPT.map(k=>`<option>${k}</option>`).join('')}</select>`;
h+=`</div></div>`});list.innerHTML=h;
copy.onclick=()=>{const t=R.map((r,i)=>{const v=(document.querySelector(`[name=k${i}]:checked`)||{}).value;let a='?';
if(v=='splash')a='use the splash';else if(v=='none')a='none of these';else if(v=='kept')a='reuse kept track '+document.getElementById('s'+i).value;
else if(v!=null){const c=r.c[+v];a=`${c.title} by ${c.author}`+(r.music?'':` (${c.cut})`)}
return `${r.sec} | ${r.name}: ${a}`}).join('\n');
out.value=t;out.style.display='block';out.select();
(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>ok.textContent='Copied.',()=>ok.textContent='Copy failed. Select the text below and press Cmd+C.')}</script>
